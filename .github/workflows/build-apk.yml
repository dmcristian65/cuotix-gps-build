name: Build CUOTIX GPS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q cuotix-gps-source-v1.1.2.zip -d project
          chmod +x project/gradlew

      - name: Build unsigned release APK
        working-directory: project
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Collect APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/android-build-tools/lib
          APK="$(find project/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifact/cuotix-gps-complemento-v1.1.2-unsigned.apk

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          cp "$BUILD_TOOLS_DIR/zipalign" artifact/android-build-tools/
          cp "$BUILD_TOOLS_DIR/apksigner" artifact/android-build-tools/
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" artifact/android-build-tools/lib/
          chmod +x artifact/android-build-tools/zipalign artifact/android-build-tools/apksigner

          printf '%s\n' \
            'APK release sin firmar de CUOTIX GPS 1.1.2.' \
            'La firma privada se aplica fuera del repositorio.' \
            > artifact/LEEME.txt

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: cuotix-gps-v1.1.2-unsigned
          path: artifact
          if-no-files-found: error
          retention-days: 7
